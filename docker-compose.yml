# Default env_file is mock-only (.env.example). For HTTP providers, copy
# .env.example → .env, point at the local contract backend or real URLs, and
# change env_file to .env. Do not invent RunPod hostnames.
services:
  procharacters:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - procharacters-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  procharacters-data: